# Generates HomerConsole.xcodeproj: `xcodegen` from this directory after changing this file.
# The generated project is committed, so building needs no xcodegen.
name: HomerConsole
options:
  bundleIdPrefix: com.martinstrambach
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  HomerConsole:
    path: ..
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    majorVersion: 2.10.0
targets:
  HomerConsole:
    type: application
    platform: macOS
    sources:
      - path: HomerConsole
        excludes:
          - Info.plist
    dependencies:
      - package: HomerConsole
        product: HomerFeature
      - package: Sparkle
    scheme: {}
    settings:
      base:
        PRODUCT_NAME: Homer Console
        PRODUCT_MODULE_NAME: HomerConsole
        PRODUCT_BUNDLE_IDENTIFIER: com.martinstrambach.HomerConsole
        # The release version, also the tag `make publish` creates — which is the package's
        # SwiftPM version too, so app and package share one version line.
        MARKETING_VERSION: 0.2.0
        # CFBundleVersion: Sparkle compares versions by it, so it follows MARKETING_VERSION.
        CURRENT_PROJECT_VERSION: $(MARKETING_VERSION)
        GENERATE_INFOPLIST_FILE: YES
        # Merged over the generated plist: only the Sparkle keys, which have no INFOPLIST_KEY_.
        INFOPLIST_FILE: HomerConsole/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Homer Console
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        SWIFT_VERSION: 6.0
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        # Not sandboxed, like Bridge Commander: downloads go straight to ~/Downloads.
        ENABLE_APP_SANDBOX: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        DEAD_CODE_STRIPPING: YES
